app:
  name: go-base
  description: Production-ready Go boilerplate
  env: development
  version: 0.1.0

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  graceful_timeout: 30s

database:
  dsn: postgres://postgres:postgres@localhost:5432/go_base?sslmode=disable
  max_idle_conns: 10
  max_open_conns: 25
  conn_max_lifetime: 1h
  auto_migrate: true

redis:
  addr: localhost:6379
  password: ""
  db: 0
  ttl: 5m

rabbitmq:
  uri: amqp://guest:guest@localhost:5672/
  exchange: events
  exchange_type: topic
  queue: default
  routing_key: default.route
  durable: true

jwt:
  private_key_path: configs/keys/private.pem
  public_key_path: configs/keys/public.pem
  issuer: go-base
  audience: go-base-clients
  expires_in: 15m
  refresh_ttl: 168h

logging:
  level: info
  mode: development

seed:
  enabled: true

security:
  allowed_origins:
    - http://localhost:3000
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Authorization
    - Content-Type
